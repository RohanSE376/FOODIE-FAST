const catMeta = id => CATEGORIES.find(c=>c.id===id);
const cafeById = id => CAFES.find(c=>c.id===id);
function flatItems(cafe){
  const out = [];
  cafe.menu.forEach(section => section.items.forEach(it => out.push(it)));
  return out;
}
function itemKey(idx){ return String(idx); }

/* =========================================================
   STORAGE HELPERS  (Firebase Firestore — shared across all visitors)
   Ratings live in a `ratings/{cafeId}` doc, one field per item index,
   updated with atomic increments so simultaneous votes never overwrite
   each other. Comments live in a `comments/{cafeId}/items` subcollection,
   one document per comment. "My vote" (so your own stars stay highlighted
   and you can re-rate) is kept in this browser's localStorage — it's not
   shared, just a per-device memory of what you personally picked.
========================================================= */
function ratingsRef(cafeId){ return doc(db, 'ratings', cafeId); }
function commentsCol(cafeId){ return collection(db, 'comments', cafeId, 'items'); }

async function loadRatings(cafeId){
  try{
    const snap = await getDoc(ratingsRef(cafeId));
    if(snap.exists()){
      const d = snap.data();
      return { sum: d.sum || {}, count: d.count || {} };
    }
  }catch(e){ console.error('loadRatings failed', e); }
  return { sum:{}, count:{} };
}

async function loadComments(cafeId){
  try{
    const q = query(commentsCol(cafeId), orderBy('ts','desc'), limit(50));
    const snap = await getDocs(q);
    return snap.docs.map(d=>{
      const v = d.data();
      return { text: v.text, ts: (v.ts && v.ts.toMillis) ? v.ts.toMillis() : Date.now() };
    });
  }catch(e){ console.error('loadComments failed', e); return []; }
}

function loadMyVotes(cafeId){
  try{
    const raw = localStorage.getItem('foodiefast_myvotes_'+cafeId);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveMyVotes(cafeId, mv){
  try{ localStorage.setItem('foodiefast_myvotes_'+cafeId, JSON.stringify(mv)); }
  catch(e){ /* ignore, e.g. private browsing */ }
}

          </div>
        </button>
      `).join('')}
    </div>
  </section>`;

  app.querySelectorAll('[data-cafe]').forEach(btn=>{
    btn.addEventListener('click', ()=> go('cafe', {cafeId: btn.dataset.cafe}));
  });

  cafes.forEach(async cafe=>{
    const data = await loadRatings(cafe.id);

      </div>
    </div>

    <div id="menu-container" class="bg-card border-x border-b border-ink/12 rounded-b-2xl px-5 md:px-8 pt-6 pb-8 -mt-px"></div>
  </section>`;

  buildMenuRows(cafe, items);
  buildPaymentAndComments(cafe);

  loadRatings(cafe.id).then(data=>{
    let sum=0,count=0;
    items.forEach((_,idx)=>{ sum += data.sum[itemKey(idx)]||0; count += data.count[itemKey(idx)]||0; });
    const avg = count ? (sum/count).toFixed(1) : '–';
    const el = document.getElementById('cafe-avg');
    if(el){
      el.className = 'shrink-0 rounded-xl bg-saffron/20 px-3 py-2 text-center';
      el.innerHTML = `<div class="font-display text-2xl text-saffron leading-none">${avg}</div><div class="text-[9px] font-mono text-paper/60 mt-0.5">${count} vote${count===1?'':'s'}</div>`;
    }
  });
}

function buildMenuRows(cafe, items){
  const container = document.getElementById('menu-container');
  if(!container) return;
  let globalIdx = 0;
  container.innerHTML = cafe.menu.map(section => {
    const rows = section.items.map(([name, price])=>{
      const idx = globalIdx++;
      const priceLabel = typeof price === 'number' ? `Rs. ${price}` : `Rs. ${price}`;
      return `
      <div class="py-3 flex items-center gap-2" data-row="${idx}">
        <div class="text-sm md:text-[15px] text-ink/90">${name}</div>
        <div class="leader"></div>
        <div class="font-mono text-sm text-ink/70 shrink-0">${priceLabel}</div>
      </div>
      <div class="pb-3 -mt-2 flex items-center justify-between flex-wrap gap-y-1" data-rating-row="${idx}">
        <div class="flex items-center gap-0.5" data-stars="${idx}">
          ${[1,2,3,4,5].map(s=>`
            <button data-star="${s}" data-idx="${idx}" aria-label="Rate ${s} star"
              class="star-btn text-lg leading-none text-ink/20">★</button>
          `).join('')}
        </div>
        <div class="font-mono text-[11px] text-ink/45" data-avg="${idx}">no ratings yet</div>
      </div>`;
    }).join('<div class="border-t border-ink/8"></div>');
    return `<div class="mb-7">
      ${section.title ? `<div class="font-display italic text-lg text-chili mb-2">${section.title}</div>` : ''}
      <div>${rows}</div>
    </div>`;
  }).join('');

  // Local, in-memory copy of this cafe's ratings — painted instantly on every
  // tap, while the real Firestore write happens quietly in the background.
  let ratingsData = { sum:{}, count:{} };
  let myVotes = loadMyVotes(cafe.id);

  container.querySelectorAll('[data-star]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.idx);
      const stars = Number(btn.dataset.star);
      const k = itemKey(idx);
      const prev = myVotes[k];
      const delta = prev ? (stars - prev) : stars;

      // 1. Update on screen immediately — no waiting on the network.
      ratingsData.sum[k] = (ratingsData.sum[k]||0) + delta;
      if(!prev) ratingsData.count[k] = (ratingsData.count[k]||0) + 1;
      myVotes[k] = stars;
      saveMyVotes(cafe.id, myVotes);
      paintStars(container, idx, ratingsData, myVotes);
      const row = container.querySelector(`[data-stars="${idx}"]`);
      row.classList.add('stamp-pop');
      setTimeout(()=>row.classList.remove('stamp-pop'), 400);

      // 2. Persist to Firestore in the background — nothing here blocks the UI.
      const ref = ratingsRef(cafe.id);
      const update = { [`sum.${k}`]: increment(delta) };
      if(!prev) update[`count.${k}`] = increment(1);
      setDoc(ref, {}, { merge:true })
        .then(()=> updateDoc(ref, update))
        .catch(e=> console.error('submitRating failed', e));
    });
  });

  loadRatings(cafe.id).then(data=>{
    ratingsData = data;
    myVotes = loadMyVotes(cafe.id);
    items.forEach((_,idx)=> paintStars(container, idx, ratingsData, myVotes));
  });
}

function paintStars(container, idx, data, mv){
  const k = String(idx);
  const myVote = mv[k] || 0;
  const count = data.count[k] || 0;
  const sum = data.sum[k] || 0;
  const avg = count ? (sum/count).toFixed(1) : null;
  const wrap = container.querySelector(`[data-stars="${idx}"]`);
  if(wrap){
    wrap.querySelectorAll('[data-star]').forEach(b=>{
      const filled = Number(b.dataset.star) <= myVote;
      b.classList.toggle('text-saffrondark', filled);
      b.classList.toggle('text-ink/20', !filled);
    });
  }
  const avgEl = container.querySelector(`[data-avg="${idx}"]`);
  if(avgEl){
    avgEl.textContent = avg ? `★ ${avg} avg · ${count} vote${count===1?'':'s'}${myVote?' · you rated '+myVote:''}` : (myVote ? `you rated ${myVote} ★` : 'no ratings yet');
  }
}

function buildPaymentAndComments(cafe){
  const wrap = document.createElement('div');
  wrap.className = 'mt-6 grid md:grid-cols-2 gap-5';
  wrap.innerHTML = `
    <div class="bg-papersoft border border-ink/10 rounded-2xl p-5">
      <div class="font-display italic text-lg text-ink mb-3">Pay via</div>
      ${cafe.payment.length ? cafe.payment.map(p=>`
        <div class="text-sm mb-2.5 pb-2.5 border-b border-ink/8 last:border-0 last:mb-0 last:pb-0">
          <div class="font-semibold text-ink/85">${p.method}</div>
          ${p.title ? `<div class="text-ink/55 text-xs">${p.title}</div>` : ''}
          ${p.number ? `<div class="font-mono text-xs text-ink/70 mt-0.5">${p.number}</div>` : ''}
        </div>
      `).join('') : `<div class="text-sm text-ink/50">Cash on the counter — no digital payment listed for this stall.</div>`}
    </div>

    <div class="bg-papersoft border border-ink/10 rounded-2xl p-5 corkline">
      <div class="font-display italic text-lg text-ink mb-3">Anonymous reviews</div>
      <form id="comment-form" class="flex gap-2 mb-4">
        <input id="comment-input" type="text" maxlength="220" placeholder="How was it? (posted anonymously)"
          class="flex-1 bg-card border border-ink/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-saffrondark transition" />
        <button type="submit" class="bg-ink text-paper text-sm font-semibold px-4 rounded-lg hover:bg-chili transition">Post</button>
      </form>
      <div id="comment-list" class="space-y-2.5 max-h-72 overflow-y-auto pr-1">
        <div class="skel h-10 rounded-lg"></div>
        <div class="skel h-10 rounded-lg"></div>
      </div>
    </div>
  `;
  app.querySelector('section').appendChild(wrap);

  const form = wrap.querySelector('#comment-form');
  const input = wrap.querySelector('#comment-input');
  const list = wrap.querySelector('#comment-list');

  function paintComments(items){
    list.innerHTML = items.length ? items.map((c,i)=>`
      <div class="rise bg-card border border-ink/10 rounded-lg px-3 py-2.5 text-sm text-ink/80 shadow-sm" style="animation-delay:${Math.min(i,6)*40}ms">
        <span class="font-mono text-[10px] text-ink/35 block mb-0.5">Anonymous · ${new Date(c.ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>
        ${escapeHTML(c.text)}
      </div>
    `).join('') : `<div class="text-sm text-ink/45 italic">No reviews yet — be the first to say something.</div>`;
  }

  let commentsList = [];
  loadComments(cafe.id).then(items=>{ commentsList = items; paintComments(commentsList); });

  form.addEventListener('submit', e=>{
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;
    input.value = '';

    // 1. Show it immediately — instant feedback, no waiting on the network.
    commentsList = [{ text, ts: Date.now() }, ...commentsList];
    paintComments(commentsList);

    // 2. Persist to Firestore in the background.
    addDoc(commentsCol(cafe.id), { text, ts: serverTimestamp() })
      .catch(e=> console.error('submitComment failed', e));
  });
}

function escapeHTML(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* =========================================================
   MAIN RENDER SWITCH
========================================================= */
function render(){
  renderBreadcrumb();
  if(state.screen==='home') return renderHome();
  if(state.screen==='category') return renderCategory();
  if(state.screen==='cafe') return renderCafe();
}

render();
</script>
</body>
