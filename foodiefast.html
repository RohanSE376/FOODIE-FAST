<style>
  :root{
    --ink: #201613;
    --paper: #FAF3E6;
  }
  *{ -webkit-tap-highlight-color: transparent; }
  html{ scroll-behavior: smooth; }
  body{
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    background-image:
      radial-gradient(rgba(32,22,19,0.05) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  ::selection{ background: #E3A73E; color: #201613; }

  /* ---------- perforated ticket-stub motif ---------- */
  .perf{
    position: relative;
    border-top: 2px dashed rgba(32,22,19,0.22);
  }
  .perf::before, .perf::after{
    content:'';
    position:absolute; top:-9px;
    width:18px; height:18px; border-radius:9999px;
    background: var(--stub-bg, var(--paper));
  }
  .perf::before{ left:-10px; }
  .perf::after{ right:-10px; }

  /* torn zig-zag edge, used once on the hero receipt header */
  .torn-bottom{
    clip-path: polygon(
      0% 0%,100% 0%,100% 92%,
      93% 100%,86% 92%,79% 100%,72% 92%,65% 100%,58% 92%,51% 100%,
      44% 92%,37% 100%,30% 92%,23% 100%,16% 92%,9% 100%,2% 92%,0% 100%
    );
    padding-bottom: 22px;
  }

  .ticket{
    transform: rotate(var(--tilt, 0deg));
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
  }
  .ticket:hover{ transform: rotate(0deg) translateY(-4px); }

  @keyframes deal-in{
    from{ opacity:0; transform: translateY(28px) rotate(var(--tilt,0deg)) scale(.96); }
    to{ opacity:1; transform: translateY(0) rotate(var(--tilt,0deg)) scale(1); }
  }
  .deal-in{ animation: deal-in .6s cubic-bezier(.2,.8,.2,1) both; }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .rise{ animation: rise .5s ease both; }

  @keyframes stamp-pop{
    0%{ transform: scale(1.6) rotate(-14deg); opacity:0; }
    60%{ transform: scale(0.94) rotate(-14deg); opacity:1; }
    100%{ transform: scale(1) rotate(-14deg); opacity:1; }
  }
  .stamp-pop{ animation: stamp-pop .35s cubic-bezier(.2,.8,.2,1) both; }

  .screen-enter{ animation: fade-slide .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fade-slide{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
    .ticket:hover{ transform:none; }
  }

  .leader{
    flex: 1 1 auto;
    border-bottom: 1.5px dotted rgba(32,22,19,0.35);
    margin: 0 8px;
    transform: translateY(-4px);
  }

  .star-btn{ transition: transform .15s ease; }

  .star-btn:focus-visible, a:focus-visible, button:focus-visible{
    outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px;

    background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(32,22,19,0.06) 27px, rgba(32,22,19,0.06) 28px);

const catMeta = id => CATEGORIES.find(c=>c.id===id);
const cafeById = id => CAFES.find(c=>c.id===id);
function flatItems(cafe){
  const out = [];
  cafe.menu.forEach(section => section.items.forEach(it => out.push(it)));
  return out;
}
function itemKey(idx){ return String(idx); }

/* =========================================================
   STORAGE HELPERS  (window.storage — persistent, per docs)
========================================================= */
async function getJSON(key, shared, fallback){
  try{
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function setJSON(key, shared, value){
  try{ return await window.storage.set(key, JSON.stringify(value), shared); }
  catch(e){ console.error('storage set failed', e); return null; }
}

async function loadRatings(cafeId){
  return await getJSON('ratings:'+cafeId, true, { sum:{}, count:{} });
}
async function loadComments(cafeId){
  return await getJSON('comments:'+cafeId, true, []);
}
async function loadMyVotes(cafeId){
  return await getJSON('myvotes:'+cafeId, false, {});
}

async function submitRating(cafeId, idx, stars){
  const key = 'ratings:'+cafeId;
  const data = await loadRatings(cafeId);
  const mv = await loadMyVotes(cafeId);
  const k = itemKey(idx);
  const prev = mv[k];
  if(prev){
    data.sum[k] = (data.sum[k]||0) - prev + stars;
  } else {
    data.sum[k] = (data.sum[k]||0) + stars;
    data.count[k] = (data.count[k]||0) + 1;
  }
  mv[k] = stars;
  await setJSON(key, true, data);
  await setJSON('myvotes:'+cafeId, false, mv);
  return { data, mv };
}

async function submitComment(cafeId, text){
  const key = 'comments:'+cafeId;
  const list = await loadComments(cafeId);
  list.unshift({ text, ts: Date.now() });
  await setJSON(key, true, list);
  return list;
}

  window.scrollTo({top:0, behavior:'smooth'});
}

function renderBreadcrumb(){
  if(state.screen==='home'){ breadcrumb.innerHTML=''; return; }
  let html = `<button data-nav="home" class="hover:text-ink transition">Home</button>`;

    const cm = catMeta(state.category);
    html += `<span class="text-ink/30">/</span><button data-nav="category" class="hover:text-ink transition">${cm.label}</button>`;
  }
  if(state.screen==='cafe' && state.cafeId){
    const cafe = cafeById(state.cafeId);
    html += `<span class="text-ink/30">/</span><span class="text-ink">${cafe.name}</span>`;
  }
  breadcrumb.innerHTML = html;
  breadcrumb.querySelectorAll('[data-nav]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const target = b.dataset.nav;
      if(target==='home') go('home');
      if(target==='category') go('category', {category: state.category});
    });
  });

              </div>
            </div>
            <span id="avg-badge-${cafe.id}" class="skel rounded-full w-14 h-6 shrink-0"></span>
          </div>
          <div class="mt-4 text-xs font-semibold text-saffrondark inline-flex items-center gap-1">
            View full menu <span aria-hidden="true">→</span>
          </div>
        </button>
      `).join('')}
    </div>
  </section>`;

  app.querySelectorAll('[data-cafe]').forEach(btn=>{
    btn.addEventListener('click', ()=> go('cafe', {cafeId: btn.dataset.cafe}));
  });

  cafes.forEach(async cafe=>{
    const data = await loadRatings(cafe.id);
    const items = flatItems(cafe);
    let sum=0, count=0;
    items.forEach((_,idx)=>{ sum += data.sum[itemKey(idx)]||0; count += data.count[itemKey(idx)]||0; });
    const avg = count ? (sum/count).toFixed(1) : null;
    const el = document.getElementById('avg-badge-'+cafe.id);
    if(!el) return;
    el.className = 'shrink-0 rounded-full px-2.5 py-1 text-xs font-mono font-semibold ' + (avg ? 'bg-saffron/25 text-saffrondark' : 'bg-ink/5 text-ink/35');
    el.textContent = avg ? `★ ${avg}` : 'unrated';
  });
}

/* =========================================================
   RENDER: CAFE DETAIL
========================================================= */
function renderCafe(){
  const cafe = cafeById(state.cafeId);
  const items = flatItems(cafe);

  app.innerHTML = `
  <section class="screen-enter pt-8">
    <div class="torn-bottom bg-ink text-paper rounded-t-2xl px-5 md:px-8 pt-7">
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="text-[11px] font-mono tracking-widest text-saffron/90 mb-1">ORDER TICKET</div>
          <h2 class="font-display text-3xl md:text-5xl leading-[0.95]">${cafe.emoji} ${cafe.name}</h2>
          <div class="text-sm text-paper/65 mt-2">📍 ${cafe.location}</div>
        </div>
        <div id="cafe-avg" class="skel rounded-xl w-20 h-14 shrink-0"></div>
      </div>
    </div>

    <div id="menu-container" class="bg-card border-x border-b border-ink/12 rounded-b-2xl px-5 md:px-8 pt-6 pb-8 -mt-px"></div>
  </section>`;

  buildMenuRows(cafe, items);
  buildPaymentAndComments(cafe);

  loadRatings(cafe.id).then(data=>{
    let sum=0,count=0;
    items.forEach((_,idx)=>{ sum += data.sum[itemKey(idx)]||0; count += data.count[itemKey(idx)]||0; });
    const avg = count ? (sum/count).toFixed(1) : '–';
    const el = document.getElementById('cafe-avg');
    if(el){
      el.className = 'shrink-0 rounded-xl bg-saffron/20 px-3 py-2 text-center';
      el.innerHTML = `<div class="font-display text-2xl text-saffron leading-none">${avg}</div><div class="text-[9px] font-mono text-paper/60 mt-0.5">${count} vote${count===1?'':'s'}</div>`;
    }
  });
}

function buildMenuRows(cafe, items){
  const container = document.getElementById('menu-container');
  if(!container) return;
  let globalIdx = 0;
  container.innerHTML = cafe.menu.map(section => {
    const rows = section.items.map(([name, price])=>{
      const idx = globalIdx++;
      const priceLabel = typeof price === 'number' ? `Rs. ${price}` : `Rs. ${price}`;
      return `
      <div class="py-3 flex items-center gap-2" data-row="${idx}">
        <div class="text-sm md:text-[15px] text-ink/90">${name}</div>
        <div class="leader"></div>
        <div class="font-mono text-sm text-ink/70 shrink-0">${priceLabel}</div>
      </div>
      <div class="pb-3 -mt-2 flex items-center justify-between flex-wrap gap-y-1" data-rating-row="${idx}">
        <div class="flex items-center gap-0.5" data-stars="${idx}">
          ${[1,2,3,4,5].map(s=>`
            <button data-star="${s}" data-idx="${idx}" aria-label="Rate ${s} star"
              class="star-btn text-lg leading-none text-ink/20">★</button>
          `).join('')}
        </div>
        <div class="font-mono text-[11px] text-ink/45" data-avg="${idx}">no ratings yet</div>
      </div>`;
    }).join('<div class="border-t border-ink/8"></div>');
    return `<div class="mb-7">
      ${section.title ? `<div class="font-display italic text-lg text-chili mb-2">${section.title}</div>` : ''}
      <div>${rows}</div>
    </div>`;
  }).join('');

  container.querySelectorAll('[data-star]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = Number(btn.dataset.idx);
      const stars = Number(btn.dataset.star);
      const { data, mv } = await submitRating(cafe.id, idx, stars);
      paintStars(container, idx, data, mv);
      const row = container.querySelector(`[data-stars="${idx}"]`);
      row.classList.add('stamp-pop');
      setTimeout(()=>row.classList.remove('stamp-pop'), 400);
    });
  });

  loadRatings(cafe.id).then(async data=>{
    const mv = await loadMyVotes(cafe.id);
    items.forEach((_,idx)=> paintStars(container, idx, data, mv));
  });
}

function paintStars(container, idx, data, mv){
  const k = String(idx);
  const myVote = mv[k] || 0;
  const count = data.count[k] || 0;
  const sum = data.sum[k] || 0;
  const avg = count ? (sum/count).toFixed(1) : null;
  const wrap = container.querySelector(`[data-stars="${idx}"]`);
  if(wrap){
    wrap.querySelectorAll('[data-star]').forEach(b=>{
      const filled = Number(b.dataset.star) <= myVote;
      b.classList.toggle('text-saffrondark', filled);
      b.classList.toggle('text-ink/20', !filled);
    });
  }
  const avgEl = container.querySelector(`[data-avg="${idx}"]`);
  if(avgEl){
    avgEl.textContent = avg ? `★ ${avg} avg · ${count} vote${count===1?'':'s'}${myVote?' · you rated '+myVote:''}` : (myVote ? `you rated ${myVote} ★` : 'no ratings yet');
  }
}

function buildPaymentAndComments(cafe){
  const wrap = document.createElement('div');
  wrap.className = 'mt-6 grid md:grid-cols-2 gap-5';
  wrap.innerHTML = `
    <div class="bg-papersoft border border-ink/10 rounded-2xl p-5">
      <div class="font-display italic text-lg text-ink mb-3">Pay via</div>
      ${cafe.payment.length ? cafe.payment.map(p=>`
        <div class="text-sm mb-2.5 pb-2.5 border-b border-ink/8 last:border-0 last:mb-0 last:pb-0">
          <div class="font-semibold text-ink/85">${p.method}</div>
          ${p.title ? `<div class="text-ink/55 text-xs">${p.title}</div>` : ''}
          ${p.number ? `<div class="font-mono text-xs text-ink/70 mt-0.5">${p.number}</div>` : ''}
        </div>
      `).join('') : `<div class="text-sm text-ink/50">Cash on the counter — no digital payment listed for this stall.</div>`}
    </div>

    <div class="bg-papersoft border border-ink/10 rounded-2xl p-5 corkline">
      <div class="font-display italic text-lg text-ink mb-3">Anonymous reviews</div>
      <form id="comment-form" class="flex gap-2 mb-4">
        <input id="comment-input" type="text" maxlength="220" placeholder="How was it? (posted anonymously)"
          class="flex-1 bg-card border border-ink/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-saffrondark transition" />
        <button type="submit" class="bg-ink text-paper text-sm font-semibold px-4 rounded-lg hover:bg-chili transition">Post</button>
      </form>
      <div id="comment-list" class="space-y-2.5 max-h-72 overflow-y-auto pr-1">
        <div class="skel h-10 rounded-lg"></div>
        <div class="skel h-10 rounded-lg"></div>
      </div>
    </div>
  `;
  app.querySelector('section').appendChild(wrap);

  const form = wrap.querySelector('#comment-form');
  const input = wrap.querySelector('#comment-input');
  const list = wrap.querySelector('#comment-list');

  function paintComments(items){
    list.innerHTML = items.length ? items.map((c,i)=>`
      <div class="rise bg-card border border-ink/10 rounded-lg px-3 py-2.5 text-sm text-ink/80 shadow-sm" style="animation-delay:${Math.min(i,6)*40}ms">
        <span class="font-mono text-[10px] text-ink/35 block mb-0.5">Anonymous · ${new Date(c.ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span>
        ${escapeHTML(c.text)}
      </div>
    `).join('') : `<div class="text-sm text-ink/45 italic">No reviews yet — be the first to say something.</div>`;
  }

  loadComments(cafe.id).then(paintComments);

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;
    input.disabled = true;
    const list_ = await submitComment(cafe.id, text);
    input.disabled = false;
    input.value = '';
    paintComments(list_);
  });
}

function escapeHTML(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* =========================================================
   MAIN RENDER SWITCH
========================================================= */
function render(){
  renderBreadcrumb();
  if(state.screen==='home') return renderHome();
  if(state.screen==='category') return renderCategory();
  if(state.screen==='cafe') return renderCafe();
}

render();
</script>
</body>
